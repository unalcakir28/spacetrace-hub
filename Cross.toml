# cross runs the build inside a container and does not forward the environment
# by default. Without this the two musl targets build with no version stamp,
# which would make the Linux binaries the only ones unable to say which build
# they are — and Linux is where the hub actually runs.
[build.env]
passthrough = [
    "SPACETRACE_GIT_SHA",
    "SPACETRACE_BUILD_DATE",
    "SPACETRACE_CHANNEL",
]
