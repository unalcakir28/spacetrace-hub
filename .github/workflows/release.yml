name: Release

# Two outputs, one pipeline:
#
#   * static binaries, published **into the public repo**
#     (unalcakir28/spacetrace) — a private repository's release assets need a
#     credential to download and a download page cannot supply one, so the
#     source stays private and the binaries are public. See RELEASING.md.
#   * a container image on ghcr.io, amd64 and arm64, assembled from those same
#     binaries rather than compiled under emulation.
#
#   push to main   -> tag `hub-continuous` and image tags `main` / `edge`
#   push of a v*   -> tag `hub-v…` and image tags `v…` / `latest`

on:
  push:
    branches: [main]
    tags: ["v*"]
    # CHANGELOG.md is named out of this list deliberately: it is not
    # documentation but the release notes themselves, and a push that only
    # touches it must still rebuild, or the continuous release keeps describing
    # the version before it. The filter applies to tag pushes too.
    paths-ignore:
      - "README.md"
      - "RELEASING.md"
      - "tasks/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to build as, e.g. v0.1.0-test"
        required: true
      publish:
        description: >-
          Publish the result. Off by default, so a dispatch is a dry run.
          Turn it on to release a tag by hand — which is the way out if the
          paths-ignore filter above skipped a tag push.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  DOWNLOAD_REPO: unalcakir28/spacetrace
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  meta:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      rolling: ${{ steps.pick.outputs.rolling }}
      tag: ${{ steps.pick.outputs.tag }}
      channel: ${{ steps.pick.outputs.channel }}
    steps:
      - uses: actions/checkout@v5
      - id: pick
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          tagged=false
          if [ -n "${INPUT_TAG:-}" ]; then
            version="$INPUT_TAG"; rolling=false
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="$GITHUB_REF_NAME"; rolling=false; tagged=true
          else
            version=continuous; rolling=true
          fi

          if [ "$rolling" = true ]; then channel=continuous; else channel=release; fi

          # A tag that disagrees with Cargo.toml ships a binary that lies about
          # its own version: hub-v0.2.0 in the file name, 0.1.0 from /health.
          # Real tag pushes only — a dispatch often names v0.1.0-test on
          # purpose, which is supposed to disagree.
          if [ "$tagged" = true ]; then
            manifest=$(grep -m1 '^version = ' Cargo.toml | sed 's/^version = "\(.*\)"/\1/')
            if [ "$version" != "v$manifest" ]; then
              echo "::error::tag $version does not match version $manifest in Cargo.toml"
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "rolling=$rolling" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "tag=hub-$version" >> "$GITHUB_OUTPUT"
          echo "Building as hub-$version" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ matrix.target }}
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl, so the hub is one file with no runtime to install — the same
          # promise the agent makes.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            arch: amd64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            arch: arm64
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-compilation tooling
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          cargo install cross --locked

      - name: Build
        shell: bash
        # Stamped in so /health and the About page can say which build this is,
        # not only which version — every continuous build shares one number.
        # Passed through the environment because `cross` builds in a container
        # with no checkout, and because a build script that shells out to git
        # only reruns when cargo thinks its inputs changed.
        #
        # --locked matters more here than in the core repo: the core crates are
        # git dependencies with no rev, so without it two builds of one tag can
        # embed different scanner code.
        env:
          SPACETRACE_GIT_SHA: ${{ github.sha }}
          SPACETRACE_CHANNEL: ${{ needs.meta.outputs.channel }}
        run: |
          export SPACETRACE_BUILD_DATE="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }} --bin spacetrace-hub
          else
            cargo build --release --locked --target ${{ matrix.target }} --bin spacetrace-hub
          fi

      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          name="spacetrace-hub-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp target/${{ matrix.target }}/release/spacetrace-hub "dist/${name}/"
          cp README.md docker-compose.yml "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C "dist/${name}" .

      # The raw binary as well as the archive: the image build copies it
      # straight in, and unpacking a tarball inside a Docker context to get one
      # file back out is work for nothing.
      - name: Stage the binary for the image
        if: matrix.arch != ''
        shell: bash
        run: |
          mkdir -p image/bin/${{ matrix.arch }}
          cp target/${{ matrix.target }}/release/spacetrace-hub image/bin/${{ matrix.arch }}/

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.arch != ''
        with:
          name: image-${{ matrix.arch }}
          # The directory, not a glob: with `image/**` the artifact's root
          # becomes image/bin/<arch> and the layout the Dockerfile copies from
          # is lost.
          path: image
          if-no-files-found: error

  publish:
    name: publish ${{ needs.meta.outputs.tag }}
    needs: [meta, build]
    # A dispatch is a dry run unless it was asked to publish.
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: archive-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          path: image
          pattern: image-*
          merge-multiple: true

      - name: Checksums
        # Regular files only, and never the sums file itself: `sha256sum ./*`
        # dies on the first directory it meets, which is how a stray folder in
        # an artifact takes the whole release down.
        run: |
          cd artifacts
          find . -maxdepth 1 -type f ! -name SHA256SUMS -exec sha256sum {} + \
            | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Where do these go
        id: dest
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -n "${RELEASE_TOKEN:-}" ]; then
            echo "repo=$DOWNLOAD_REPO" >> "$GITHUB_OUTPUT"
          else
            echo "repo=$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"
            echo "::warning title=Downloads are not public::RELEASE_TOKEN is unset, so the binaries were published into this private repository. Their URLs need a credential to fetch, which the download page cannot supply. RELEASING.md has the one command that fixes it."
          fi

      - name: Publish the binaries
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ steps.dest.outputs.repo }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
          ROLLING: ${{ needs.meta.outputs.rolling }}
        run: |
          # The changes come out of CHANGELOG.md rather than from a generator.
          # The generator lives in the core repo and is not a command here, but
          # CHANGELOG.md is produced from the *pinned* version of that crate and
          # a test asserts it is current — so slicing it is what guarantees
          # these notes match the changelog compiled into the binary being
          # published. Running the tool against the core's main branch would
          # not.
          if [ "$ROLLING" = "true" ]; then
            section="Unreleased"
          else
            section="${VERSION#v} — "
          fi
          awk -v want="$section" '
            index($0, "## " want) == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > changes.md

          # A release with no notes is worse than no release: the reader cannot
          # tell whether the notes are missing or the version was empty.
          if [ "$ROLLING" != "true" ] && [ ! -s changes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${VERSION}"
            exit 1
          fi

          cat > notes.md <<EOF
          spacetrace hub, built from \`$GITHUB_REPOSITORY\` at \`${GITHUB_SHA:0:7}\` on $(date -u '+%Y-%m-%d %H:%M UTC').

          One static binary and one SQLite file — no database server, no frontend build.

          \`\`\`sh
          docker pull ${IMAGE}:${VERSION}
          \`\`\`

          Setup: https://spacetrace.teknobakkall.com/hub/
          EOF

          if [ -s changes.md ]; then
            printf '\n## What changed\n' >> notes.md
            cat changes.md >> notes.md
          fi

          if [ "$ROLLING" = "true" ]; then
            gh release delete "$TAG" --repo "$REPO" --cleanup-tag --yes || true
            gh release create "$TAG" artifacts/* \
              --repo "$REPO" \
              --prerelease \
              --title "Hub — continuous build (main)" \
              --notes-file notes.md
          else
            # --latest=false: the download repository holds all three
            # components, and `gh release create` otherwise makes whichever
            # published most recently GitHub's "latest". That endpoint belongs
            # to the CLI — `spacetrace update` and the agent in versions up to
            # v0.4.0 read it, and a hub tag there parses as no version at all,
            # so those installs go quiet and stay quiet. Measured on 9 Sept
            # 2026, when hub-v0.3.0 took the slot.
            gh release create "$TAG" artifacts/* \
              --repo "$REPO" \
              --latest=false \
              --title "spacetrace hub $VERSION" \
              --notes-file notes.md
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: tags
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          ROLLING: ${{ needs.meta.outputs.rolling }}
        run: |
          if [ "$ROLLING" = "true" ]; then
            echo "list=${IMAGE}:main,${IMAGE}:edge" >> "$GITHUB_OUTPUT"
          else
            echo "list=${IMAGE}:${VERSION},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: image
          file: .github/docker/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          provenance: false
